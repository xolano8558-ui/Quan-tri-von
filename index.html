<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Vốn & Đi Lệnh</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #00b894;
            --accent-red: #ff4d4d;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 {
            margin-top: 0;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: var(--accent-green);
        }
        .row {
            display: flex;
            gap: 12px;
        }
        .row .form-group {
            flex: 1;
        }
        .results-box {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-top: 24px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
        }
        .result-row:last-child {
            margin-bottom: 0;
        }
        .result-val {
            font-weight: bold;
        }
        .highlight-loss {
            color: var(--accent-red);
        }
        .highlight-profit {
            color: var(--accent-green);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 Quản Trị Vốn & Đi Lệnh</h2>
    <div class="subtitle">Tính toán khối lượng vị thế và quản trị rủi ro chuyên nghiệp</div>

    <div class="form-group">
        <label>Tổng Vốn Tài Khoản ($)</label>
        <input type="number" id="accountBalance" value="1000" oninput="calculateTradingMetrics()">
    </div>

    <div class="form-group">
        <label>Rủi Ro Mỗi Lệnh (%)</label>
        <input type="number" id="riskPercentage" value="2" step="0.1" oninput="calculateTradingMetrics()">
    </div>

    <div class="row">
        <div class="form-group">
            <label>Giá Entry ($)</label>
            <input type="number" id="entryPrice" value="65000" oninput="calculateTradingMetrics()">
        </div>
        <div class="form-group">
            <label>Đòn Bẩy (x)</label>
            <input type="number" id="leverage" value="20" oninput="calculateTradingMetrics()">
        </div>
    </div>

    <div class="row">
        <div class="form-group">
            <label>Cắt Lỗ - Stop Loss ($)</label>
            <input type="number" id="stopLoss" value="61000" oninput="calculateTradingMetrics()">
        </div>
        <div class="form-group">
            <label>Chốt Lời - Take Profit ($)</label>
            <input type="number" id="takeProfit" value="69000" oninput="calculateTradingMetrics()">
        </div>
    </div>

    <div class="results-box">
        <div class="result-row">
            <span>Khối lượng vị thế (Units/Coin):</span>
            <span id="positionUnits" class="result-val">0.0000</span>
        </div>
        <div class="result-row">
            <span>Tổng giá trị vị thế (Position Size):</span>
            <span id="totalPositionSize" class="result-val">$0.00</span>
        </div>
        <div class="result-row">
            <span>Ký quỹ tối thiểu (Margin):</span>
            <span id="requiredMargin" class="result-val">$0.00</span>
        </div>
        <div class="result-row">
            <span>Số Tiền Lỗ Dự Kiến:</span>
            <span id="lossAmount" class="result-val highlight-loss">-$0.00</span>
        </div>
        <div class="result-row">
            <span>Số Tiền Lãi Dự Kiến:</span>
            <span id="profitAmount" class="result-val highlight-profit">+$0.00</span>
        </div>
        <div class="result-row">
            <span>Tỷ Lệ R : R:</span>
            <span id="rrRatio" class="result-val">1:1.00</span>
        </div>
    </div>
</div>

<script>
function calculateTradingMetrics() {
    // 1. Lấy giá trị đầu vào
    let balance = parseFloat(document.getElementById('accountBalance').value) || 0;
    let riskPct = parseFloat(document.getElementById('riskPercentage').value) || 0;
    let entry = parseFloat(document.getElementById('entryPrice').value) || 0;
    let leverage = parseFloat(document.getElementById('leverage').value) || 1;
    let sl = parseFloat(document.getElementById('stopLoss').value) || 0;
    let tp = parseFloat(document.getElementById('takeProfit').value) || 0;

    // 2. Tính số tiền chịu rủi ro (Số tiền LỖ nếu chạm SL)
    let lossAmount = balance * (riskPct / 100);

    let units = 0;
    let positionSize = 0;
    let margin = 0;
    let profitAmount = 0;
    let rr = 0;

    if (entry > 0) {
        let slDistance = Math.abs(entry - sl);
        if (slDistance > 0) {
            // Khối lượng = Số tiền rủi ro / Khoảng cách SL
            units = lossAmount / slDistance;
            positionSize = units * entry;
            margin = leverage > 0 ? positionSize / leverage : positionSize;

            // Tính khoảng cách TP để ra Lãi và R:R
            let tpDistance = Math.abs(tp - entry);
            rr = tpDistance / slDistance;
            profitAmount = lossAmount * rr;
        }
    }

    // 3. Hiển thị kết quả ra màn hình
    document.getElementById('positionUnits').innerText = units.toFixed(4);
    document.getElementById('totalPositionSize').innerText = `$${positionSize.toFixed(2)}`;
    document.getElementById('requiredMargin').innerText = `$${margin.toFixed(2)}`;
    document.getElementById('lossAmount').innerText = `-$${lossAmount.toFixed(2)}`;
    document.getElementById('profitAmount').innerText = `+$${profitAmount.toFixed(2)}`;
    document.getElementById('rrRatio').innerText = `1:${rr.toFixed(2)}`;
}

// Chạy tính toán ngay khi tải trang lần đầu
window.onload = calculateTradingMetrics;
</script>

</body>
</html>
