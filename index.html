<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Vốn, Thi Quỹ & Tổng Hợp Nhật Ký</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --card-inner: #1f2937;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #00b894;
            --accent-red: #ff4d4d;
            --accent-yellow: #f59e0b;
            --accent-blue: #3b82f6;
            --border-color: #374151;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        h2 {
            margin: 0;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
        }
        .side-selector {
            display: flex;
            background: var(--card-inner);
            border-radius: 8px;
            padding: 3px;
            border: 1px solid var(--border-color);
        }
        .side-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .side-btn.active.long {
            background: var(--accent-green);
            color: #fff;
        }
        .side-btn.active.short {
            background: var(--accent-red);
            color: #fff;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        @media(max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .card-box {
            background: var(--card-inner);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }
        .card-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .summary-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .mini-card {
            background: var(--card-inner);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        .mini-card .label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .mini-card .val {
            font-size: 15px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        input, select {
            width: 100%;
            padding: 9px 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 15px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: var(--accent-green);
        }
        .row-2 {
            display: flex;
            gap: 10px;
        }
        .row-2 .form-group {
            flex: 1;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .result-row:last-child {
            margin-bottom: 0;
        }
        .result-val {
            font-weight: bold;
        }
        .highlight-loss {
            color: var(--accent-red);
        }
        .highlight-profit {
            color: var(--accent-green);
        }
        .highlight-warn {
            color: var(--accent-yellow);
        }
        .error-text {
            color: var(--accent-red);
            font-size: 12px;
            margin-top: 5px;
            font-style: italic;
        }
        .ftmo-box {
            background: rgba(245, 158, 11, 0.05);
            border: 1px dashed var(--accent-yellow);
            border-radius: 10px;
            padding: 12px;
            margin-top: 16px;
        }

        .btn-save {
            width: 100%;
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 15px;
        }
        .btn-save:hover {
            opacity: 0.9;
        }

        /* Phần tổng hợp & Nhật ký */
        .journal-section {
            background: var(--card-inner);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
        }
        .journal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .btn-clear {
            background: transparent;
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-clear:hover {
            background: var(--accent-red);
            color: white;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-box {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .stat-box .s-label {
            font-size: 11px;
            color: var(--text-muted);
        }
        .stat-box .s-val {
            font-size: 14px;
            font-weight: bold;
            margin-top: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            color: var(--text-muted);
            font-weight: 600;
        }
        .badge-long {
            background: rgba(0, 184, 148, 0.2);
            color: var(--accent-green);
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .badge-short {
            background: rgba(255, 77, 77, 0.2);
            color: var(--accent-red);
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-top">
        <div>
            <h2>🏛️ Quản Trị Vốn, Thi Quỹ & Tổng Hợp Lãi Lỗ</h2>
            <div class="subtitle">Kiểm soát rủi ro chuẩn quỹ và tổng hợp hiệu suất giao dịch</div>
        </div>
        <div class="side-selector">
            <button id="btnLong" class="side-btn active long" onclick="setSide('LONG')">LONG</button>
            <button id="btnShort" class="side-btn short" onclick="setSide('SHORT')">SHORT</button>
        </div>
    </div>

    <!-- Tóm tắt nhanh lệnh hiện tại -->
    <div class="summary-row">
        <div class="mini-card">
            <div class="label">Rủi Ro Lệnh Này</div>
            <div
